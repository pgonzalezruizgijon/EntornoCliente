<div style="background: white; border: 2px solid #333; border-radius: 10px; padding: 15px; width: 250px; text-align: center; box-shadow: 5px 5px 15px rgba(0,0,0,0.2);">
  
  <h3 style="margin: 0 0 10px 0;">Crédito: {{credito}}€</h3>
  
  <div style="display: flex; justify-content: center; gap: 10px; background: #eee; padding: 10px; border-radius: 5px; border: inset 3px #999; margin-bottom: 15px;">
    
    <div style="background: white; padding: 5px; border: 1px solid #000;">
      <img [src]="'assets/' + slots[0]" width="50" height="50" style="display: block;">
    </div>
    
    <div style="background: white; padding: 5px; border: 1px solid #000;">
      <img [src]="'assets/' + slots[1]" width="50" height="50" style="display: block;">
    </div>
    
    <div style="background: white; padding: 5px; border: 1px solid #000;">
      <img [src]="'assets/' + slots[2]" width="50" height="50" style="display: block;">
    </div>

  </div>

  <button (click)="jugar()" style="width: 100%; padding: 10px; background: orange; font-weight: bold; cursor: pointer; border-radius: 5px; border: 1px solid #cc8400;">
    ¡Jugar!
  </button>

  <div style="height: 20px; margin-top: 10px; color: red; font-weight: bold;">
    {{mensaje}}
  </div>
</div>
