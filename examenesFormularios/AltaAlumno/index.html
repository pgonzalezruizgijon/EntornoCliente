<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alta alumno</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Archivo JS -->
  <script src="alta_alumno.js"></script>
</head>

<body>
  <div class="container border mt-3 mb-3 p-4">
    <h1>Alta alumno</h1>

    <form name="miformulario" method="POST" action="procesar_alumno.php">

      <div class="mb-3">
        <label class="form-label" for="minombre">Nombre (*):</label>
        <input class="form-control" type="text" maxlength="30" name="minombre" id="minombre" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Sexo (*):</label>

        <div class="form-check">
          <input type="radio" class="form-check-input" id="misexo_h" name="misexo" value="H" required>
          <label class="form-check-label" for="misexo_h">Hombre</label>
        </div>

        <div class="form-check">
          <input type="radio" class="form-check-input" id="misexo_m" name="misexo" value="M">
          <label class="form-check-label" for="misexo_m">Mujer</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="miedad">Edad (0-120) (*):</label>
        <input class="form-control" type="number" id="miedad" name="miedad" min="0" max="120" step="1" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="mifecha">Fecha nacimiento (*):</label>
        <input class="form-control" type="date" id="mifecha" name="mifecha" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="misemana">Semana preferente de matrícula (*):</label>
        <input class="form-control" type="week" id="misemana" name="misemana" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="mideportista">Es deportista:</label>
        <input type="checkbox" class="form-check-input" name="mideportista" id="mideportista">

        <label class="form-label" for="mideporte">Tipo de deporte:</label>
        <select class="form-select" name="mideporte" id="mideporte" disabled>
          <option value="0">Seleccionar</option>
          <option value="1">Fútbol</option>
          <option value="2">Baloncesto</option>
          <option value="3">Tenis</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" for="miobservaciones">Observaciones:</label>
        <textarea class="form-control" name="miobservaciones" id="miobservaciones" rows="5"></textarea>
      </div>

      <input type="submit" class="btn btn-primary" id="enviar" value="Enviar">
      <input type="reset" class="btn btn-danger" id="borrar" value="Borrar">

    </form>

    <div id="resultado" class="mt-4 p-3 border bg-light"></div>
  </div>
</body>
</html>
